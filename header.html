<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
        <style>

                        /* Light Mode Colors (default) */
            :root {
                --background-color: #efeff2;
                --primary-color: #004a2f;
                --accent-color: #379956;
                --button-color: #135e2b;
                --button-hover-color: #379956;
                --modal-bg-color: white;
                --modal-text-color: #333;
                --footer-bg-color: #333;
                --footer-text-color: white;
                --light-dark-button-color: #333;
                --light-dark-button-inside-color: white;
            }

            /* Dark Mode Colors */
            body.dark-mode {
                --background-color: #333;
                --primary-color: #1a2a1f;
                --accent-color: #004a2f;
                --button-color: #004a2f;
                --button-hover-color: #379956;
                --modal-bg-color: #dcd5d5;
                --modal-text-color: #333;
                --footer-bg-color: #1a2a1f;
                --footer-text-color: white;
                --light-dark-button-color: white;
                --light-dark-button-inside-color: #333;
            }

            body {
                font-family: Arial, sans-serif;
                background-color: var(--background-color);
                color: var(--modal-text-color);
                line-height: 1.6;
            }

            header {
                background-color: #135e2b;
                color: white;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 20px;
                width: 100%;
            }

            header h1 {
                margin: 0;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                /* font-style: italic; */
            }

            nav ul {
                list-style: none;
                display: flex;
                justify-content: center;
                padding: 0;
            }

            nav ul li {
                margin: 0 30px;
            }

            nav ul li a {
                color: white;
                text-decoration: none;
                font-weight: bold;
                font-size: large;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                position: relative;
                display: inline-block;
                padding-bottom: 5px; /* Adds a little space below the text */
            }
            
            nav ul li a::after {
                content: "";
                position: absolute;
                left: 50%;
                bottom: 0;
                width: 0;
                height: 2px; /* Thickness of the underline */
                background-color: white; /* Color of the underline */
                transform: translateX(-50%);
                transition: width 0.3s ease; /* Controls the animation speed and timing */
            }

            nav ul li a:hover::after {
                width: 100%; /* Expands the underline from left to right */
            }

            /* Light/Dark Mode Toggle Button */
            #light_dark {
                position: fixed;
                bottom: 40px;
                right: 5px;
            }

            #light_dark_button {
                background-color: var(--light-dark-button-color);
                color: var(--light-dark-button-inside-color);
                border: none;
                padding: 17px;
                border-radius: 50%;
                cursor: pointer;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
                transition: background-color 0.3s ease;
            }

            #light_dark_button:hover {
                background-color: #e0e0e0;
            }

        </style>
    <body>

            <h1>StudyMate</h1>
            <nav>
                <ul>

                </ul>
            </nav>
        </header>
    </body>
</html>
