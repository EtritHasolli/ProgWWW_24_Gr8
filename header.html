<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
        <style>
           /* Light Mode Colors (default) */
            :root {
                --background-color: #f5f5fa;         /* Light background with a soft, neutral tone */
                --modal-text-color: #3a3a3a;        /* Dark gray for easy readability */
            }

            /* Dark Mode Colors */
            body.dark-mode {
                --background-color: #2b2b2e;        /* Deep charcoal for balanced contrast */
                --modal-text-color: #f0f0f0;        /* Light gray text for clear readability */
            }

            body {
                font-family: Arial, sans-serif;
                background-color: var(--background-color);
                color: var(--modal-text-color);
                line-height: 1.5;
            }

            header {
                background-color: var(--header-color);
                color: white;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 20px;
                width: 100%;
            }

            header h1 {
                margin: 0;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                /* font-style: italic; */
            }

            nav ul {
                list-style: none;
                display: flex;
                justify-content: center;
                padding: 0;
            }

            nav ul li {
                margin: 0 30px;
            }

            nav ul li a {
                color: white;
                text-decoration: none;
                font-weight: bold;
                font-size: large;
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                position: relative;
                display: inline-block;
                padding-bottom: 5px; /* Adds a little space below the text */
            }
            
            nav ul li a::after {
                content: "";
                position: absolute;
                left: 50%;
                bottom: 0;
                width: 0;
                height: 2px; /* Thickness of the underline */
                background-color: white; /* Color of the underline */
                transform: translateX(-50%);
                transition: width 0.3s ease; /* Controls the animation speed and timing */
            }

            nav ul li a:hover::after {
                width: 100%; /* Expands the underline from left to right */
            }
        </style>
    <body>
        <header>
            <h1>StudyMate</h1>
            <nav>
                <ul>

                    <li><a href="study_meth.html#methods">Study Methods</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="minigames.html">Minigames</a></li>
                </ul>
            </nav>
        </header>
    </body>
</html>
