<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <style>
         /* Basic Reset */
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* Light Mode Colors (default) */
        :root {
            --background-color: #efeff2;
            --primary-color: #004a2f;
            --accent-color: #379956;
            --button-color: #135e2b;
            --button-hover-color: #379956;
            --modal-bg-color: white;
            --modal-text-color: #333;
            --footer-bg-color: #1a2a1f;
            --footer-text-color: white;
            --light-dark-button-color: #333;
            --light-dark-button-inside-color: white;
        }

        /* Dark Mode Colors */
        body.dark-mode {
            --background-color: #333;
            --primary-color: #1a2a1f;
            --accent-color: #004a2f;
            --button-color: #004a2f;
            --button-hover-color: #379956;
            --modal-bg-color: #dcd5d5;
            --modal-text-color: #333;
            --footer-bg-color: black;
            --footer-text-color: white;
            --light-dark-button-color: white;
            --light-dark-button-inside-color: #333;
        }

        footer {
            background-color: var(--footer-bg-color);
            color: var(--footer-text-color); /* Use the white color defined in :root */
            padding: 10px 0;
            text-align: center;
            width: 100%;
        }

        footer p {
            margin: 0;
            color: var(--footer-text-color); /* Ensures white text in both modes */
        }
    </style>
    <body>
        <footer>
            <p>&copy; 2024 StudyMate. All rights reserved.</p>
        </footer>
    </body>
</html>
