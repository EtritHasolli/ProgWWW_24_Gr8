<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <style>
         /* Basic Reset */
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--background-color);
        }

        :root {
            --header-color: #356859;

            --background-color: #f5f5fa;         /* Light background with a soft, neutral tone */
            --primary-color: #356859;           /* Calming, muted green for primary elements */
            --accent-color: #4a7c68;            /* Slightly softened green for accents */
            --button-color: #4a7c68;            /* Softer button color for balance with primary color */
            --button-text-color: white;
            --button-hover-color: #56b08d;      /* Slightly brighter for hover effect */

            /* Modal Colors */
            --modal-bg-color: #ffffff;          /* Pure white modal for clean contrast */
            --modal-text-color: #3a3a3a;        /* Dark gray for easy readability */
            --modal-btn-color: #4a7c68;
            --modal-btn-hover-color: #56b08d;

            /* Footer Colors */
            --footer-bg-color: #3a3a3a;         /* Dark gray footer background for modern feel */
            --footer-text-color: #ffffff;       /* White footer text for strong contrast */

            /* Light/Dark Button Colors */
            --light-dark-button-color: #3a3a3a; /* Consistent dark gray for toggle button */
            --light-dark-button-inside-color: #f5f5fa; /* Matches background for unity */
            --light-dark-button-hover-color: #878585;

            --book-page-color: #e8e1e1;
            --book-text-color: #3a3a3a;
            --book-background-color: white;
            --book-border-color: #333;

            /* flash card colors */
            --back-flash-card: #CA97A6;
            --back-del-btn: #3a3a3a;
            --front-flash-card: #356859;
            --front-del-btn: #3a3a3a;
            --flash-card-text: white;

            /* minigames stuff */
            --flag-color: red;
            --cell-color: #ccc;
            --cell-reveal-color: #fff;
            --cell-text-color: #2b2b2e;
            
            /* Cornell notes stuff */
            --notes-background: #f5f5fa;
            --notes-title-color: black;
            --notes-page-bg: white;
            --notes-text-color: #3a3a3a;
        }

        /* Light Mode Colors (default) */
        body.light-mode-defaults {
            --header-color: #356859;

            --background-color: #f5f5fa;         /* Light background with a soft, neutral tone */

            --modal-btn-hover-color: #56b08d;

            /* Pop-Up Color */
            --pop-color: #ffffff;
            --pop-text-color: #3a3a3a;

            /* Footer Colors */
            --footer-bg-color: #3a3a3a;         /* Dark gray footer background for modern feel */

            /* Light/Dark Button Colors */

            /* minigames stuff */
            --flag-color: red;
            --cell-color: #ccc;
            --cell-reveal-color: #fff;
            --cell-text-color: #2b2b2e;
            
            /* Cornell notes stuff */
            --notes-background: #f5f5fa;
            --notes-title-color: black;
            --notes-page-bg: white;
            --notes-text-color: #3a3a3a;
        }

        /* Dark Mode Colors */
        body.dark-mode {

            --background-color: #2b2b2e;        
            --primary-color: #4a6a5a;           
            --accent-color: #56b08d;

            /* Modal Colors */

            /* light/Dark Mode Button */

            --light-dark-button-inside-color: #2b2b2e; 
            --light-dark-button-hover-color: #bcbbbb;

            --study-info-color: #f0f0f0;

            --book-text-color: #3a3a3a;
            --book-background-color: white;

            /* flash card colors */
            --front-flash-card: #356859;

            --flash-card-text: white;
            --back-flash-card: #CA97A6;

            /* minigames stuff */

            --cell-reveal-color: #fff;
            --cell-text-color: #2b2b2e;

            /* Cornell notes stuff */
            --notes-background: #f5f5fa;
            --notes-title-color: black;
            --notes-page-bg: white;

        }

            --light-dark-button-color: #3a3a3a; /* Consistent dark gray for toggle button */

            /* flash card colors */

            --front-flash-card: #356859;

            /* minigames stuff */

            --notes-background: #f5f5fa;

            --notes-text-color: #3a3a3a;
        }

        footer {
            background-color: var(--footer-bg-color);
            color: var(--footer-text-color); 
            padding: 10px 0;
            text-align: center;
            width: 100%;
        }

        footer p {
            margin: 0;
            color: var(--footer-text-color);
        }
    </style>
