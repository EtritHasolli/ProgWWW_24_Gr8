<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <style>
         /* Basic Reset */
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* Light Mode Colors (default) */
        :root {
            --background-color: #f5f5fa;         /* Light background with a soft, neutral tone */
            --primary-color: #356859;           /* Calming, muted green for primary elements */
            --accent-color: #4a7c68;            /* Slightly softened green for accents */
            --button-color: #4a7c68;            /* Softer button color for balance with primary color */
            --button-hover-color: #56b08d;      /* Slightly brighter for hover effect */
            --modal-bg-color: #ffffff;          /* Pure white modal for clean contrast */
            --modal-text-color: #3a3a3a;        /* Dark gray for easy readability */
            --footer-bg-color: #3a3a3a;         /* Dark gray footer background for modern feel */
            --footer-text-color: #ffffff;       /* White footer text for strong contrast */
            --light-dark-button-color: #3a3a3a; /* Consistent dark gray for toggle button */
            --light-dark-button-inside-color: #f5f5fa; /* Matches background for unity */
        }

        /* Dark Mode Colors */
        body.dark-mode {
            --background-color: #2b2b2e;        /* Deep charcoal for balanced contrast */
            --primary-color: #4a6a5a;           /* Muted green-gray for a subdued primary color */
            --accent-color: #56b08d;            /* Vibrant accent to add interest */
            --button-color: #356859;            /* Darkened button color for cohesion */
            --button-hover-color: #68d1a0;      /* Brightened hover for distinct interaction */
            --modal-bg-color: #3a3a3a;          /* Dark gray modal for a subtle look */
            --modal-text-color: #f0f0f0;        /* Light gray text for clear readability */
            --footer-bg-color: #3a3a3a;         /* Darker footer for seamless footer-background flow */
            --footer-text-color: #f0f0f0;       /* Light gray for footer text */
            --light-dark-button-color: #f0f0f0; /* Consistent light gray for toggle button */
            --light-dark-button-inside-color: #2b2b2e; /* Matches dark background for unity */
            --study-info-color: #f0f0f0;        /* Light text color for study information readability */
            --book-page-color: #e8e1e1;
            --book-text-color: #3a3a3a;
            --book-background-color: white;
            --book-border-color: #333;
        }


        footer {
            background-color: var(--footer-bg-color);
            color: var(--footer-text-color); /* Use the white color defined in :root */
            padding: 10px 0;
            text-align: center;
            width: 100%;
        }

        footer p {
            margin: 0;
            color: var(--footer-text-color); /* Ensures white text in both modes */
        }
    </style>
    <body>
        <footer>
            <p>&copy; 2024 StudyMate. All rights reserved.</p>
        </footer>
    </body>
</html>
