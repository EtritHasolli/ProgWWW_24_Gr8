<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery & HTML API Example</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<style>
    .box {
        width: 100px;
        height: 100px;
        display: inline-block;
        margin: 5px;
    }
    .red { background-color: red; }
    .blue { background-color: blue; }
    .green { background-color: green; }
</style>

<body>
    <!-- Go to Homepage Button -->
    <button id="goToHomePage" onclick="location.href='homepage.html';">Go to Homepage</button>

    <h1>jQuery and HTML API Example</h1>
    <button id="myButton">Click Me</button>
    <input type="text" id="myInput" placeholder="Type something">
    <p id="text">This is some text.</p>

    <div class="box red"></div>
    <div class="box blue"></div>
    <div class="box green"></div>
    <p class="info">Click a box to change its size.</p>

    <button id="hideBtn">Hide</button>
    <button id="showBtn">Show</button>
    <p id="text">This text will be hidden or shown.</p>

    <button id="fadeBtn">Fade In/Out</button>
    <button id="slideBtn">Slide Up/Down</button>
    <div id="box" style="width:100px; height:100px; background-color:orange;"></div>

    <div id="square" style="width:50px; height:50px; background-color:purple;"></div>
    <button id="animateBtn">Animate</button>

    <button id="hideTextBtn">Hide Text</button>
    <p id="text2">This text will disappear and alert you when done!</p>

    <!-- Geolocation -->
    <h2>Geolocation Example</h2>
    <button id="getLocation">Get My Location</button>
    <p id="location"></p>

    <h2>Web Worker Example</h2>
    <button id="startWorker">Start Worker</button>
    <button id="stopWorker">Stop Worker</button>
    <p id="workerResult">Result: <span id="resultValue">0</span></p>

    <script>
        let worker;
        let currentValue = 0; // Store the current value

        // Start the worker
        $("#startWorker").click(function () {
            if (!worker) { // Only create a new worker if it doesn't exist
                worker = new Worker("js/worker.js"); // Link to worker.js
                worker.onmessage = function (event) {
                    currentValue = event.data; // Update the current value
                    $("#resultValue").text(currentValue); // Display the updated value
                };
            }
        });

        // Stop the worker
        $("#stopWorker").click(function () {
            if (worker) {
                worker.terminate(); // Stop the worker
                worker = null; // Reset the worker variable
                $("#resultValue").text(currentValue); // Display the current value when stopped
            }
        });
    </script>
    
    <script>
        // Ngjarjet dhe efektet jQuery
        $("#myButton").click(function () {
            alert("Button clicked!");
        });

        $("#myInput").keydown(function (e) {
            console.log("You pressed: " + e.key);
        });

        $("#text").hover(
            function () {
                $(this).css("color", "blue");
            },
            function () {
                $(this).css("color", "black");
            }
        );

        $(".box").click(function () {
            $(this).css("width", "200px");
        });

        $(".box:first").css("border", "2px solid black");
        $(".blue").css("background-color", "lightblue");

        $("#hideBtn").click(function () {
            $("#text").hide();
        });

        $("#showBtn").click(function () {
            $("#text").show();
        });

        $("#fadeBtn").click(function () {
            $("#box").fadeToggle();
        });

        $("#slideBtn").click(function () {
            $("#box").slideToggle();
        });

        $("#animateBtn").click(function () {
            $("#square").animate({
                width: "200px",
                height: "200px",
                marginLeft: "50px"
            }, 1000);
        });

        $("#hideTextBtn").click(function () {
            $("#text2").fadeOut(1000, function () {
                alert("Text is now hidden!");
            });
        });

        // Përdorimi i Geolocation
        $("#getLocation").click(function () {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function (position) {
                    $("#location").text("Latitude: " + position.coords.latitude + 
                                        ", Longitude: " + position.coords.longitude);
                });
            } else {
                $("#location").text("Geolocation is not supported by this browser.");
            }
        });
    </script>
</body>
<script src="js/worker.js"></script>
</html>
