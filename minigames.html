<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | StudyMate</title>
    <link rel="stylesheet" href="minigames.css"> <!-- Link to your CSS file -->
</head>
<body onload="loadHeader(); loadFooter()">

    <main>

        </div>
    </main>

    <div id="footer"></div>
    <script src="header_load.js"></script>
    <script src="minigames.js"></script> <!-- Move this to end of body -->
