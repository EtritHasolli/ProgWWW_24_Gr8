<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper Game | StudyMate</title>
    <link rel="stylesheet" href="css/minigames.css">
</head>
<body onload="loadHeader(), loadFooter(), loadBody()">
    <div id="header"></div>
    <div id="welcomeModal" class="modal">
        <div class="modal-content">
          <h2>Welcome to the Minigames Section</h2>
          <p>Click with the right mouse button to flag the mine and the Left mouse button to uncover the ground.</p>
          <p>Check the numbers and then take a step!!</p>
          <button id="closeWelcomeModal">Start Game</button>
        </div>
      </div>
      

    <main>
        <div id="gameBoard"></div>
        <button id="reset_button">Reset Game</button>
    </main>

    <div id="light_dark">
        <button id="light_dark_button">
            <i id="lightDark" class="fa fa-moon-o" aria-hidden="true"></i>
        </button>

        <button id="openColorPickerBtn"><i class="fa fa-paint-brush" aria-hidden="true"></i></button>
        <!-- Color Picker Modal -->
        <div id="colorPickerModal" class="modal">
            <div class="modal-content">
                <h3>Select Colors</h3>

                <div class="color-picker-section">
                    <input type="color" id="headerColorInput" value="#356859">
                    <label for="headerColorInput">- Header Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="backgroundColorInput" value="#f5f5fa">
                    <label for="backgroundColorInput">- Background Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="cellColorInput" value="#356859">
                    <label for="cellColorInput">- Cell Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="cellRevealColorInput" value="#4a7c68">
                    <label for="cellRevealColorInput">- Revealed Cell Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="cellTextColorInput" value="#4a7c68">
                    <label for="cellTextColorInput">- Cell Text Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="flagColorInput" value="#4a7c68">
                    <label for="flagColorInput">- Flag Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="buttonColorInput" value="#4a7c68">
                    <label for="buttonColorInput">- Button Color</label>
                </div>

                <!-- Apply and Close buttons -->
                <div id="colorModalBtn" class="button-container">
                    <button id="defaultColorsBtn">Return Default</button>
                    <button id="applyColorsBtn">Apply Colors</button>
                    <button id="closeColorPickerModal">Close</button>
                </div>
            </div>
        </div>
    </div>
    
    <input type="color" id="colorPickerInput" style="display: none;">

    <div id="footer"></div>
    <script src="js/header_load.js"></script>
    <script src="js/minigames.js"></script>
</body>
</html>
