<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/flash_cards_style.css">
    <title>Flash Cards | StudyMate</title>
</head>
<body onload="loadHeader(), loadFooter(), loadCards(), loadBody()">
    <!-- Header Section -->
    <div id="header"></div>

    <main>
        <!-- Flash Card Input Form -->
        <div id="add-card-form">
            <input type="text" id="question" placeholder="Enter your question" required>
            <input type="text" id="answer" placeholder="Enter your answer" required>
            <button onclick="addFlashCard()">Add Flash Card</button>
        </div>     

        <!-- Flashcard Table -->
        <div class="table-container">
            <table>
                <tr>
                </tr>
            </table>
        </div>
    </main>

    <!-- Light/Dark Mode Toggle Button -->
    <div id="light_dark">
        <button id="light_dark_button">
            <i id="lightDark" class="fa fa-moon-o" aria-hidden="true"></i>
        </button>

        <button id="openColorPickerBtn"><i class="fa fa-paint-brush" aria-hidden="true"></i></button>
        <!-- Color Picker Modal -->
        <div id="colorPickerModal" class="modal">
            <div class="modal-content">
                <h3>Select Colors</h3>

                <div class="color-picker-section">
                    <input type="color" id="headerColorInput" value="#356859">
                    <label for="headerColorInput">- Header Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="backgroundColorInput" value="#f5f5fa">
                    <label for="backgroundColorInput">- Background Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="flashCardTextColorInput" value="#356859">
                    <label for="flashCardTextColorInput ">- Flash Card Text Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="frontCardColorInput" value="#356859">
                    <label for="frontCardColorInput">- Front Card Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="backCardColorInput" value="#4a7c68">
                    <label for="backCardColorInput">- Back Card Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="buttonColorInput" value="#4a7c68">
                    <label for="buttonColorInput">- Button Color</label>
                </div>

                <!-- Apply and Close buttons -->
                <div id="colorModalBtn" class="button-container">
                    <button id="defaultColorsBtn">Return Default</button>
                    <button id="applyColorsBtn">Apply Colors</button>
                    <button id="closeColorPickerModal">Close</button>
                </div>
            </div>
        </div>
    </div>
    
    <input type="color" id="colorPickerInput" style="display: none;">

    <div id="footer"></div>
    
    <script src="js/flash_cards.js"></script>
    <script src="js/header_load.js"></script>
</body>
</html>
