<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"/>
    <link rel="stylesheet" type="text/css" href="css/flash_cards_style.css">
    <title>Flash Cards</title>
</head>
<body onload="loadHeader(); loadFooter(); loadCards()">
    <!-- Header Section -->
    <div id="header"></div>

    <main>
        <!-- Flash Card Input Form -->
        <div id="add-card-form">
            <input type="text" id="question" placeholder="Enter your question" required>
            <input type="text" id="answer" placeholder="Enter your answer" required>
            <button onclick="addFlashCard()">Add Flash Card</button>
        </div>     

        <!-- Flashcard Table -->
        <div class="table-container">
            <table>
                <tr>
                </tr>
            </table>
        </div>
    </main>

    <!-- Light/Dark Mode Toggle Button -->
    <div id="light_dark">
        <button id="light_dark_button">
            <i id="lightDark" class="fa fa-moon-o" aria-hidden="true"></i>
        </button>
    </div>

    <div id="footer"></div>
    
    <script src="js/flash_cards.js"></script>
    <script src="js/header_load.js"></script>
</body>
</html>
