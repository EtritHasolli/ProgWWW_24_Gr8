<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"/>
    <link rel="stylesheet" type="text/css" href="css/cornell.css">
    <title>Cornell Notes Layout</title>
</head>
<body onload="loadHeader(), loadFooter(), loadBody()">

    <!-- Header Section -->
    <div id="header"></div>

    <!-- Cornell Notes Layout -->
    <main class="cornell-notes">
        <div>
            <h1>Cornell Notes</h1>
            <p>Topic: <input type="text" placeholder="Enter topic here"></p>
        </div>
        <div class="notes-container">
            <div class="cue-column">
                <h2>Cues</h2>
                <textarea placeholder="Write key terms, questions, or prompts here."></textarea>
            </div>
            <div class="main-notes">
                <h2>Main Notes</h2>
                <textarea placeholder="Record lecture notes or details here."></textarea>
            </div>
        </div>
        <div class="summary">
            <h2>Summary</h2>
            <textarea placeholder="Summarize the main points in a few sentences here."></textarea>
        </div>
    </main>

    <!-- Light/Dark Mode Toggle Button -->
    <div id="light_dark">
        <button id="light_dark_button">
            <i id="lightDark" class="fa fa-moon-o" aria-hidden="true"></i>
        </button>

        <button id="openColorPickerBtn"><i class="fa fa-paint-brush" aria-hidden="true"></i></button>
        <!-- Color Picker Modal -->
        <div id="colorPickerModal" class="modal">
            <div class="modal-content">
                <h3>Select Colors</h3>

                <div class="color-picker-section">
                    <input type="color" id="headerColorInput" value="#356859">
                    <label for="headerColorInput">- Header Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="backgroundColorInput" value="#f5f5fa">
                    <label for="backgroundColorInput">- Background Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="notesColorInput" value="#356859">
                    <label for="notesColorInput">- Note Page Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="titleColorInput" value="#4a7c68">
                    <label for="titleColorInput">- Notes Title Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="textColorInput" value="#4a7c68">
                    <label for="textColorInput">- Text Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="buttonColorInput" value="#4a7c68">
                    <label for="buttonColorInput">- Button Color</label>
                </div>

                <!-- Apply and Close buttons -->
                <div id="colorModalBtn" class="button-container">
                    <button id="defaultColorsBtn">Return Default</button>
                    <button id="applyColorsBtn">Apply Colors</button>
                    <button id="closeColorPickerModal">Close</button>
                </div>
            </div>
        </div>
    </div>
    
    <input type="color" id="colorPickerInput" style="display: none;">

    <!-- Footer Section -->
    <div id="footer"></div>
    <script src="js/header_load.js"></script>
    <script src="js/cornell.js"></script>
</body>
</html>
