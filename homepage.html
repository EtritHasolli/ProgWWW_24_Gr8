<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link class="styleMaybe" rel="stylesheet" type="text/css" href="css/homepage_light.css">
    <title>Study Website</title>
</head>
<body onload="loadHeader(), loadFooter()">
    <div id="header"></div>
    <main>
        <section id="timer-section">
            <h2>Study Timer</h2>
            <div class="pauseAndTimer">
                <button id="studyBtn" style="display: flex;"><i id="studyIcon" class="fa fa-play" aria-hidden="true"></i></button> <!-- Default to play -->
                <div id="timer">00:00:00</div>
            </div>
            <h2>Break Timer</h2>
            <div class="breakTimer">
                <button id="breakBtn" style="display: flex;"><i id="breakIcon" class="fa fa-play" aria-hidden="true"></i></button>
                <div id="break">00:00:00</div>
            </div>            
            <button id="selectTimerBtn">Select Timer</button>
            <button id="breakSelect">Select Break</button>
            <button id="resetBtn">Reset</button>
        </section>

        <!-- The Modal -->
        <div id="timerModal" class="modal">
            <div class="modal-content">
                <h3>Select Study Time</h3>
                
                <div class="time-selector">
                    <div class="transTime">
                        <div class="pre-time" id="preHour">00</div>
                        <div class="time-item" id="hourDisplay">00</div>
                        <div class="post-time" id="postHour">00</div>
                    </div>
                    <span>:</span>
                    <div class="transTime">
                        <div class="pre-time" id="preMinute">00</div>
                        <div class="time-item" id="minuteDisplay">00</div>
                        <div class="post-time" id="postMinute">00</div>
                    </div>
                    <span>:</span>
                    <div class="transTime">
                        <div class="pre-time" id="preSecond">00</div>
                        <div class="time-item" id="secondDisplay">00</div>
                        <div class="post-time" id="postSecond">00</div>
                    </div>
                </div>
                
                <!-- Add buttons container -->
                <div class="button-container">
                    <button id="setTimerBtn">Set Timer</button>
                    <button id="closeModalBtn">Close</button> <!-- Close button -->
                </div>
            </div>
        </div>

        <!-- The Break Modal -->
        <div id="breakModal" class="bModal">
            <div class="bModal-content">
                <h3>Select Break Time</h3>
                
                <div class="bTime-selector">
                    <div class="bTransTime">
                        <div class="pre-break" id="preBreakHour">00</div>
                        <div class="bTime-item" id="breakHourDisplay">00</div>
                        <div class="post-break" id="postBreakHour">00</div>
                    </div>
                    <span>:</span>
                    <div class="bTransTime">
                        <div class="pre-break" id="preBreakMinute">00</div>
                        <div class="bTime-item" id="breakMinuteDisplay">00</div>
                        <div class="post-break" id="postBreakMinute">00</div>
                    </div>
                    <span>:</span>
                    <div class="bTransTime">
                        <div class="pre-break" id="preBreakSecond">00</div>
                        <div class="bTime-item" id="breakSecondDisplay">00</div>
                        <div class="post-break" id="postBreakSecond">00</div>
                    </div>
                </div>
                
                <!-- Add buttons container -->
                <div class="button-container">
                    <button id="setBreakTimer">Set Break</button>
                    <button id="closeBreakModal">Close</button> <!-- Close button -->
                </div>
            </div>
        </div>

        <section id="study-info">
            <h2>Your Study Sessions</h2>
            <p>Track your study sessions using the timer above.</p>
        </section>
    </main>

    <div id="light_dark">
        <button id="light_dark_button"> <i class="fa fa-picture-o" aria-hidden="true"></i></button>
    </div>
    <div id="footer"></div>
    <script src="js/homepage_script.js"></script>
    <script src="js/header_load.js"></script>
</body>
</html>
