<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/favicon-session.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" type="text/css" href="css/homepage.css">
    <title>Study Website</title>
</head>  
<body onload="loadHeader(), loadFooter(), loadBody()">
    <div id="header"></div>

    <section id="goals-section">
        <div class="goals-container">
            <header class="goals-header">
                <div class="goals-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="goals-icon">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M12 19a6 6 0 005.765-7.667l1.558-1.558a8 8 0 11-1.422-2.177l-1.416 1.417A6 6 0 1012 19zm-2-6a2 2 0 013.245-1.565 1 1 0 101.247-1.564 4 4 0 101.182 4.712 1 1 0 10-1.836-.792A2 2 0 0110 13z"
                            fill="#FF6F61"></path>
                    </svg>
                    <h2>Session Goals</h2>
                </div>
            </header>
    
            <div class="goal-input">
                <textarea placeholder="Type a goal..." id="goal-textarea"></textarea>
                <button id="add-goal-btn" class="add-goal-btn">+</button>
            </div>
    
            <div class="goals-stats">
                <div class="open-goals">
                    <span id="open-goals-count">0</span>
                    <p>Open</p>
                </div>
                <div class="completed-goals">
                    <span id="completed-goals-count">0</span>
                    <p>Completed</p>
                </div>
            </div>
    
            <ul id="goals-list" class="goals-list">
                <!-- Dynamic goals will be added here -->
            </ul>
        </div>
    </section>
    

    <!-- main stuff -->
    <main>
        <section id="timer-section">
            <h2>Study Timer</h2>
            <div class="pauseAndTimer">
                <button id="studyBtn" style="display: flex;"><i id="studyIcon" class="fa fa-play" aria-hidden="true"></i></button> <!-- Default to play -->
                <div id="timer">00:00:00</div>
            </div>
            <h2>Break Timer</h2>
            <div class="breakTimer">
                <button id="breakBtn" style="display: flex;"><i id="breakIcon" class="fa fa-play" aria-hidden="true"></i></button>
                <div id="break">00:00:00</div>
            </div>            
            <button id="selectTimerBtn">Select Timer</button>
            <button id="breakSelect">Select Break</button>
            <button id="resetBtn">Reset</button>
        </section>

        <!-- The Study Modal -->
        <div id="timerModal" class="modal">
            <div class="modal-content">
                <h3>Select Study Time</h3>
                
                <div class="time-selector">
                    <div class="transTime">
                        <div class="pre-time" id="preHour">00</div>
                        <div class="time-item" id="hourDisplay">00</div>
                        <div class="post-time" id="postHour">00</div>
                    </div>
                    <span>:</span>
                    <div class="transTime">
                        <div class="pre-time" id="preMinute">00</div>
                        <div class="time-item" id="minuteDisplay">00</div>
                        <div class="post-time" id="postMinute">00</div>
                    </div>
                    <span>:</span>
                    <div class="transTime">
                        <div class="pre-time" id="preSecond">00</div>
                        <div class="time-item" id="secondDisplay">00</div>
                        <div class="post-time" id="postSecond">00</div>
                    </div>
                </div>
                
                <!-- Add buttons container -->
                <div class="button-container">
                    <button id="setTimerBtn">Set Timer</button>
                    <button id="closeModalBtn">Close</button> <!-- Close button -->
                </div>
            </div>
        </div>

        <!-- The Break Modal -->
        <div id="breakModal" class="bModal">
            <div class="bModal-content">
                <h3>Select Break Time</h3>
                
                <div class="bTime-selector">
                    <div class="bTransTime">
                        <div class="pre-break" id="preBreakHour">00</div>
                        <div class="bTime-item" id="breakHourDisplay">00</div>
                        <div class="post-break" id="postBreakHour">00</div>
                    </div>
                    <span>:</span>
                    <div class="bTransTime">
                        <div class="pre-break" id="preBreakMinute">00</div>
                        <div class="bTime-item" id="breakMinuteDisplay">00</div>
                        <div class="post-break" id="postBreakMinute">00</div>
                    </div>
                    <span>:</span>
                    <div class="bTransTime">
                        <div class="pre-break" id="preBreakSecond">00</div>
                        <div class="bTime-item" id="breakSecondDisplay">00</div>
                        <div class="post-break" id="postBreakSecond">00</div>
                    </div>
                </div>
                
                <!-- Add buttons container -->
                <div class="button-container">
                    <button id="setBreakTimer">Set Break</button>
                    <button id="closeBreakModal">Close</button> <!-- Close button -->
                </div>
            </div>
        </div>

        <section id="study-info">
            <h2>Your Study Sessions</h2>
            <p>Track your study sessions using the timer above.</p>
        </section>
    </main>

    <div id="light_dark">
        <button id="light_dark_button">
            <i id="lightDark" class="fa fa-moon-o" aria-hidden="true"></i>
        </button>

        <button id="openColorPickerBtn"><i class="fa fa-paint-brush" aria-hidden="true"></i></button>
        <!-- Color Picker Modal -->
        <div id="colorPickerModal" class="modal">
            <div class="modal-content">
                <h3>Select Colors</h3>

                <div class="color-picker-section">
                    <input type="color" id="headerColorInput" value="#356859">
                    <label for="headerColorInput">- Header Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="backgroundColorInput" value="#f5f5fa">
                    <label for="backgroundColorInput">- Background Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="popColorInput" value="#356859">
                    <label for="popColorInput">- Timer Section Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="accentColorInput" value="#4a7c68">
                    <label for="accentColorInput">- Time Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="buttonColorInput" value="#4a7c68">
                    <label for="buttonColorInput">- Button Color</label>
                </div>

                <!-- Apply and Close buttons -->
                <div id="colorModalBtn" class="button-container">
                    <button id="defaultColorsBtn">Return Default</button>
                    <button id="applyColorsBtn">Apply Colors</button>
                    <button id="closeColorPickerModal">Close</button>
                </div>
            </div>
        </div>
    </div>
    
    <input type="color" id="colorPickerInput" style="display: none;">
    
    <div id="footer"></div>
    <script src="js/homepage_script.js"></script>
    <script src="js/header_load.js"></script>
</body>
</html>
