<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | StudyMate</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"/>
    <link rel="stylesheet" href="css/about.css">
</head>

<body onload="loadHeader(), loadFooter(), loadBody()">
    <div id="header"></div>

    <main>
        <div class="profile-container">
            <!-- Profile 1 -->
            <div class="profile">
                <img src="img/etrit.png" alt="Etrit's profile picture" class="profile-img">
                <h3>Etrit Hasolli</h3>
                <p>Jo HIDI</p>
                <p>Email: etrithasolli5@gmail.com</p>
                <p>LinkedIn: <a href="https://www.linkedin.com/in/etrit-hasolli-6156332b6/">Etrit Hasolli</a></p>
            </div>

            <!-- Profile 2 -->
            <div class="profile">
                <img src="img/Adnan.png" alt="Adnan's profile picture" class="profile-img">
                <h3>Adnan Hajdaraj</h3>
                <p>PO HIDI</p>
                <p>Email: adnan.hadaraj20@gmail.com</p>
                <p>LinkedIn: <a href="https://www.linkedin.com/in/adnan-hajdaraj-0353482a6/">Adnan Hajdaraj</a></p>
            </div>
        </div>
    </main>
    
    <div id="light_dark">
        <button id="light_dark_button">
            <i id="lightDark" class="fa fa-moon-o" aria-hidden="true"></i>
        </button>

        <button id="openColorPickerBtn"><i class="fa fa-paint-brush" aria-hidden="true"></i></button>
        <!-- Color Picker Modal -->
        <div id="colorPickerModal" class="modal">
            <div class="modal-content">
                <h3>Select Colors</h3>

                <div class="color-picker-section">
                    <input type="color" id="headerColorInput" value="#356859">
                    <label for="headerColorInput">- Header Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="backgroundColorInput" value="#f5f5fa">
                    <label for="backgroundColorInput">- Background Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="popColorInput" value="#356859">
                    <label for="popColorInput">- Timer Section Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="accentColorInput" value="#4a7c68">
                    <label for="accentColorInput">- Time Color</label>
                </div>
                <div class="color-picker-section">
                    <input type="color" id="buttonColorInput" value="#4a7c68">
                    <label for="buttonColorInput">- Button Color</label>
                </div>

                <!-- Apply and Close buttons -->
                <div id="colorModalBtn" class="button-container">
                    <button id="defaultColorsBtn">Return Default</button>
                    <button id="applyColorsBtn">Apply Colors</button>
                    <button id="closeColorPickerModal">Close</button>
                </div>
            </div>
        </div>
    </div>
    
    <input type="color" id="colorPickerInput" style="display: none;">
    
    <div id="footer"></div>
    <script src="js/about.js"></script>
    <script src="js/header_load.js"></script>
</body>
</html>
